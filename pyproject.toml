[project]
name = "regulai-sentinel"
version = "1.0.0"
description = "RegulAI Sentinel - Regulatory Compliance AI Pipeline"
requires-python = ">=3.8"
dependencies = [
    "ibm-watsonx-ai",
    "python-dotenv",
    "requests",
    "fastmcp",
    "fastapi",
    "uvicorn"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"